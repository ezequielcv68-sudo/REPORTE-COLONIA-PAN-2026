<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PANEL DE ADMINISTRACIÓN — MEJORAS EN TU COLONIA 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --pan-blue: #002B7F;
    --pan-blue-light: #0047BA;
    --pan-blue-dark: #001B54;
    --pan-cyan: #00C2FF;
    --paper: #FFFFFF;
    --bg-gradient: linear-gradient(135deg, #001A4D 0%, #002B7F 45%, #0052CC 85%, #00A3E0 100%);
    --panel-bg: rgba(255, 255, 255, 0.96);
    --ink: #0A1931;
    --ink-light: #4A5568;
    --border: #E2E8F0;
    --radius: 8px;
    --font-display: 'Oswald', sans-serif;
    --font-body: 'Work Sans', sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }

  .hidden { display: none !important; }

  header.navbar {
    background: #FFFFFF;
    padding: 12px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand-logo { display: flex; align-items: center; gap: 14px; }
  .pan-emblem { width: 44px; height: 44px; flex-shrink: 0; }
  .brand-title h1 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    color: var(--pan-blue);
    margin: 0;
    line-height: 1.1;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .brand-title p {
    margin: 2px 0 0;
    font-size: 11px;
    font-weight: 600;
    color: var(--ink-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .user-badge { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
  .user-email {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--pan-blue-dark);
    background: #F0F4FA;
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid #D0DFFA;
  }
  
  .btn-header {
    background: transparent;
    border: 1.5px solid var(--pan-blue);
    color: var(--pan-blue);
    padding: 7px 14px;
    border-radius: 20px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-header:hover { background: var(--pan-blue); color: #FFFFFF; }
  .btn-header.danger { border-color: #C23B3B; color: #C23B3B; }
  .btn-header.danger:hover { background: #C23B3B; color: #FFFFFF; }

  .wrapper { max-width: 1280px; margin: 28px auto; padding: 0 20px 40px; }

  .login-card {
    max-width: 420px;
    margin: 80px auto;
    background: var(--paper);
    padding: 36px 30px;
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    text-align: center;
    border-top: 5px solid var(--pan-blue);
  }
  .login-card .pan-emblem { width: 68px; height: 68px; margin: 0 auto 14px; }
  .login-card h2 {
    font-family: var(--font-display);
    font-size: 26px;
    color: var(--pan-blue);
    margin: 0 0 6px;
    text-transform: uppercase;
  }
  .login-card p { font-size: 13px; color: var(--ink-light); margin: 0 0 24px; }
  .login-card input {
    width: 100%; padding: 12px 14px; margin-bottom: 14px;
    border-radius: var(--radius); border: 1.5px solid var(--border);
    background: #F8FAFC; font-size: 14px; outline: none;
  }
  .login-card input:focus { border-color: var(--pan-blue); background: #FFFFFF; }

  .btn-primary {
    width: 100%; padding: 12px 20px; background: var(--pan-blue);
    color: #FFFFFF; border: none; border-radius: var(--radius);
    font-family: var(--font-display); font-size: 15px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 4px 12px rgba(0, 43, 127, 0.3); transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--pan-blue-light); }
  
  .btn-link {
    background: none; border: none; color: var(--pan-blue-light);
    font-size: 13px; font-weight: 600; text-decoration: underline;
    cursor: pointer; margin-top: 16px; font-family: var(--font-body);
  }
  .btn-link:hover { color: var(--pan-blue); }

  .btn-export {
    background: #107C41; color: #FFFFFF; border: none; padding: 10px 18px;
    border-radius: var(--radius); font-family: var(--font-display); font-size: 13px;
    font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 3px 10px rgba(16, 124, 65, 0.25);
  }
  .btn-export:hover { background: #0B6132; }

  .link-foto {
    background: none; border: none; color: var(--pan-blue-light);
    font-weight: 600; cursor: pointer; text-decoration: underline;
    padding: 0; font-size: 12px; font-family: var(--font-body);
  }

  .img-modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 27, 84, 0.85);
    z-index: 1000; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .img-modal-content {
    background: #FFFFFF; padding: 16px; border-radius: 12px;
    max-width: 90%; max-height: 90vh; display: flex; flex-direction: column; gap: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .img-modal-content img { max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 4px; }
  .img-modal-actions { display: flex; justify-content: space-between; align-items: center; }

  .controls-card {
    background: var(--panel-bg); padding: 16px 20px; border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2); margin-bottom: 20px;
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between;
  }
  .filter-group { display: flex; gap: 12px; flex: 1; min-width: 280px; }
  .filter-group input, .filter-group select {
    padding: 10px 14px; border-radius: var(--radius); border: 1.5px solid var(--border);
    background: #FFFFFF; font-size: 13.5px; color: var(--ink); outline: none;
  }
  .filter-group input { flex: 2; }
  .filter-group select { flex: 1; }
  .filter-group input:focus, .filter-group select:focus { border-color: var(--pan-blue); }

  .table-card {
    background: var(--panel-bg); border-radius: var(--radius);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); overflow: hidden;
  }
  .table-wrapper { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  thead { background: var(--pan-blue-dark); color: #FFFFFF; }
  th {
    padding: 14px 16px; font-family: var(--font-display); font-size: 13px;
    letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600;
  }
  td {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--ink); vertical-align: middle;
  }
  tbody tr { background: #FFFFFF; transition: background 0.15s; }
  tbody tr:nth-child(even) { background: #F8FAFC; }
  tbody tr:hover { background: #EBF3FF; }

  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 20px;
    font-family: var(--font-display); font-size: 11px; font-weight: 700;
    letter-spacing: 0.05em; text-transform: uppercase;
  }
  .badge.pendiente { background: #FFE6E6; color: #C23B3B; border: 1px solid #FFB3B3; }
  .badge.en_proceso { background: #FFF4E5; color: #B9790A; border: 1px solid #FFE0B2; }
  .badge.aplicado { background: #E6F4EA; color: #2F7A4F; border: 1px solid #A3E2B8; }

  .badge-prio {
    font-family: var(--font-display); font-size: 10px; font-weight: 700;
    text-transform: uppercase; padding: 2px 7px; border-radius: 4px; display: inline-block;
  }
  .badge-prio.alta { background: #FFE6E6; color: #C23B3B; border: 1px solid #FFB3B3; }
  .badge-prio.media { background: #FFF4E5; color: #B9790A; border: 1px solid #FFE0B2; }
  .badge-prio.baja { background: #EBF8FF; color: #00A3E0; border: 1px solid #BEE3F8; }

  .map-link { color: var(--pan-blue-light); font-weight: 600; text-decoration: none; }
  .map-link:hover { text-decoration: underline; }

  @media (max-width: 768px) {
    header.navbar { padding: 10px 16px; flex-direction: column; gap: 12px; align-items: flex-start; }
    .brand-title h1 { font-size: 18px; }
    .filter-group { flex-direction: column; width: 100%; }
    .user-badge { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="brand-logo">
    <svg class="pan-emblem" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="#002B7F"/>
      <circle cx="50" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
      <text x="50" y="63" font-family="'Oswald', sans-serif" font-weight="700" font-size="35" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">PAN</text>
    </svg>
    <div class="brand-title">
      <h1>Panel de Administración</h1>
      <p>Plataforma de Control Urbano 2026</p>
    </div>
  </div>

  <div id="userHeader" class="user-badge hidden">
    <span class="user-email" id="userMailText"></span>
    <button class="btn-header" id="btnChangePass">Cambiar mi contraseña</button>
    <button class="btn-header danger" id="btnLogout">Cerrar Sesión</button>
  </div>
</header>

<div class="wrapper">

  <div id="loginScreen" class="login-card">
    <svg class="pan-emblem" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="#002B7F"/>
      <circle cx="50" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
      <text x="50" y="63" font-family="'Oswald', sans-serif" font-weight="700" font-size="35" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">PAN</text>
    </svg>
    <h2>Acceso Administrador</h2>
    <p>Ingresa tus credenciales autorizadas</p>
    <input type="email" id="adminEmail" placeholder="Correo electrónico">
    <input type="password" id="adminPass" placeholder="Contraseña">
    <button class="btn-primary" id="btnLogin">Iniciar Sesión</button>
    <button class="btn-link" id="btnForgotPass">¿Olvidaste o quieres cambiar tu contraseña?</button>
  </div>

  <div id="adminDashboard" class="hidden">
    
    <div class="controls-card">
      <div class="filter-group">
        <input type="text" id="filterText" placeholder="Buscar por brigadista, colonia, dirección o descripción…">
        <select id="filterColonia">
          <option value="">Todas las colonias</option>
        </select>
      </div>
      <button class="btn-export" id="btnExport">
        <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        Descargar Excel (.xlsx)
      </button>
    </div>

    <div class="table-card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Folio</th>
              <th>Fecha</th>
              <th>Brigadista</th>
              <th>Colonia</th>
              <th>Dirección / Referencia</th>
              <th>Tipo</th>
              <th>Prioridad</th>
              <th>Descripción</th>
              <th>Estado</th>
              <th>Evidencia</th>
              <th>GPS</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC3Vcpl2rxNlAg9KD8_xH8M77nRwvTyhq8",
  authDomain: "mejoras-colonia-2026.firebaseapp.com",
  projectId: "mejoras-colonia-2026",
  storageBucket: "mejoras-colonia-2026.firebasestorage.app",
  messagingSenderId: "162986211873",
  appId: "1:162986211873:web:14ca62705283d3e2c50160",
  measurementId: "G-R8W2TL7W04"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let ALL_REGISTROS = [];

auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminDashboard').classList.remove('hidden');
    document.getElementById('userHeader').classList.remove('hidden');
    document.getElementById('userMailText').textContent = user.email;
    cargarTodosLosRegistros();
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminDashboard').classList.add('hidden');
    document.getElementById('userHeader').classList.add('hidden');
  }
});

document.getElementById('btnLogin').addEventListener('click', () => {
  const email = document.getElementById('adminEmail').value;
  const pass = document.getElementById('adminPass').value;
  if(!email || !pass) return alert("Ingresa tu correo y contraseña.");
  auth.signInWithEmailAndPassword(email, pass).catch(err => alert("Error de acceso: " + err.message));
});

document.getElementById('btnForgotPass').addEventListener('click', () => {
  const email = document.getElementById('adminEmail').value.trim();
  if (!email) {
    alert("Por favor, escribe tu correo electrónico en el campo de arriba y presiona este botón para enviarte el enlace de recuperación.");
    return;
  }
  auth.sendPasswordResetEmail(email)
    .then(() => alert("Te enviamos un correo seguro con un enlace para crear tu nueva contraseña. Revisa tu bandeja de entrada o la carpeta de Spam."))
    .catch(err => alert("Error: " + err.message));
});

document.getElementById('btnChangePass').addEventListener('click', async () => {
  const nuevaPass = prompt("Ingresa tu nueva contraseña secreta (Mínimo 6 caracteres):");
  if (nuevaPass) {
    if (nuevaPass.length < 6) {
      alert("La contraseña es muy corta. Debe tener al menos 6 caracteres.");
      return;
    }
    try {
      await auth.currentUser.updatePassword(nuevaPass);
      alert("¡Tu contraseña fue actualizada con éxito!");
    } catch (error) {
      if (error.code === 'auth/requires-recent-login') {
        alert("Por seguridad, para cambiar tu contraseña debes cerrar sesión, volver a iniciar sesión e intentarlo de nuevo inmediatamente.");
      } else {
        alert("Ocurrió un error: " + error.message);
      }
    }
  }
});

document.getElementById('btnLogout').addEventListener('click', () => auth.signOut());

async function cargarTodosLosRegistros() {
  try {
    const snapshot = await db.collection("registros").orderBy("fechaCreacion", "desc").get();
    ALL_REGISTROS = snapshot.docs.map(doc => doc.data());
    poblarColonias();
    renderTabla(ALL_REGISTROS);
  } catch (e) {
    console.error("Error al cargar registros:", e);
  }
}

function poblarColonias() {
  const colonias = Array.from(new Set(ALL_REGISTROS.map(r => r.colonia))).sort();
  const select = document.getElementById('filterColonia');
  select.innerHTML = '<option value="">Todas las colonias</option>' + 
    colonias.map(c => `<option value="${c}">${c}</option>`).join('');
}

function formatearFolio(id, msFecha) {
  const d = new Date(msFecha);
  return 'F-' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '-' + id.slice(-4).toUpperCase();
}

function renderTabla(registros) {
  const tbody = document.getElementById('tableBody');
  if (!registros.length) {
    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:30px;color:#718096;">No hay registros para mostrar.</td></tr>';
    return;
  }

  tbody.innerHTML = registros.map(r => {
    const d = new Date(r.fechaCreacion);
    const folio = formatearFolio(r.id, r.fechaCreacion);
    const coords = (r.lat && r.lng) ? `<a href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank" class="map-link">Ver en mapa ↗</a>` : '<span style="color:#A0AEC0;">Sin GPS</span>';
    const estado = r.estado || 'pendiente';
    const estadoFmt = estado.replace('_', ' ');
    const prio = r.prioridad || 'media';

    let btnAntes = r.foto ? `<button class="link-foto" onclick="abrirFoto('${r.id}', 'antes')">Antes</button>` : '<span style="color:#A0AEC0;">Sin foto</span>';
    let btnDespues = r.fotoDespues ? `<button class="link-foto" style="color:#2F7A4F;" onclick="abrirFoto('${r.id}', 'despues')">Después</button>` : '';
    let btnEvidencia = btnAntes + (btnDespues ? ' | ' + btnDespues : '');

    let txtTrazabilidad = '';
    if (r.fechaEnProceso) {
      const dIni = new Date(r.fechaEnProceso);
      txtTrazabilidad += `<br><small style="color:#B9790A; font-size:10.5px; display:block; margin-top:3px;">Iniciado: ${dIni.toLocaleDateString('es-MX')} ${dIni.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</small>`;
    }
    if (r.fechaAplicado) {
      const dFin = new Date(r.fechaAplicado);
      txtTrazabilidad += `<small style="color:#2F7A4F; font-size:10.5px; font-weight:600; display:block;">Concretado: ${dFin.toLocaleDateString('es-MX')} ${dFin.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</small>`;
    }

    return `
      <tr>
        <td><b>${folio}</b></td>
        <td>${d.toLocaleDateString('es-MX')} <br><small style="color:#718096;">${d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</small></td>
        <td><b>${r.nombre || 'Sin nombre'}</b></td>
        <td><b>${r.colonia}</b></td>
        <td>${r.direccion} ${r.referencia ? '<br><small style="color:#718096;">Ref: '+r.referencia+'</small>' : ''}</td>
        <td style="text-transform:capitalize;">${r.tipo}</td>
        <td><span class="badge-prio ${prio}">${prio}</span></td>
        <td>${r.descripcion}</td>
        <td><span class="badge ${estado}">${estadoFmt}</span>${txtTrazabilidad}</td>
        <td>${btnEvidencia}</td>
        <td>${coords}</td>
      </tr>
    `;
  }).join('');
}

window.abrirFoto = function(id, tipo) {
  const registro = ALL_REGISTROS.find(r => r.id === id);
  if (!registro) return;
  const fotoSrc = tipo === 'despues' ? registro.fotoDespues : registro.foto;
  if (!fotoSrc) return;

  const folio = formatearFolio(registro.id, registro.fechaCreacion);
  const tagTexto = tipo === 'despues' ? 'Evidencia del Después' : 'Evidencia del Antes';

  const overlay = document.createElement('div');
  overlay.className = 'img-modal-overlay';
  overlay.innerHTML = `
    <div class="img-modal-content">
      <div style="font-weight:700; color:var(--pan-blue); font-size:14px;">${tagTexto} — Folio ${folio}</div>
      <img src="${fotoSrc}" alt="${tagTexto} Folio ${folio}">
      <div class="img-modal-actions">
        <a href="${fotoSrc}" download="evidencia_${tipo}_${folio}.jpg" class="btn-primary" style="width:auto; padding:8px 16px; text-decoration:none; display:inline-block;">Descargar</a>
        <button class="btn-header danger" onclick="this.closest('.img-modal-overlay').remove()">Cerrar ventana</button>
      </div>
    </div>
  `;
  
  overlay.addEventListener('click', (e) => {
    if(e.target === overlay) overlay.remove();
  });

  document.body.appendChild(overlay);
};

document.getElementById('filterText').addEventListener('input', aplicarFiltros);
document.getElementById('filterColonia').addEventListener('change', aplicarFiltros);

function aplicarFiltros() {
  const txt = document.getElementById('filterText').value.toLowerCase();
  const col = document.getElementById('filterColonia').value;

  const filtrados = ALL_REGISTROS.filter(r => {
    const matchTxt = !txt || (r.nombre + ' ' + r.colonia + ' ' + r.direccion + ' ' + r.descripcion + ' ' + r.tipo).toLowerCase().includes(txt);
    const matchCol = !col || r.colonia === col;
    return matchTxt && matchCol;
  });

  renderTabla(filtrados);
}

document.getElementById('btnExport').addEventListener('click', async () => {
  if (!ALL_REGISTROS.length) return alert('No hay datos disponibles para exportar.');

  const workbook = new ExcelJS.Workbook();
  const worksheet = workbook.addWorksheet('Reporte Global');

  worksheet.columns = [
    { header: 'Folio', key: 'folio', width: 18 },
    { header: 'Fecha Registro', key: 'fechaReg', width: 22 },
    { header: 'Fecha Ejecución (En proceso)', key: 'fechaIni', width: 26 },
    { header: 'Fecha Concretado (Aplicado)', key: 'fechaFin', width: 26 },
    { header: 'Brigadista', key: 'nombre', width: 22 },
    { header: 'Colonia', key: 'colonia', width: 20 },
    { header: 'Dirección', key: 'direccion', width: 28 },
    { header: 'Referencia', key: 'referencia', width: 22 },
    { header: 'Categoría', key: 'categoria', width: 18 },
    { header: 'Prioridad', key: 'prioridad', width: 15 },
    { header: 'Descripción', key: 'descripcion', width: 32 },
    { header: 'Estado', key: 'estado', width: 15 },
    { header: 'Foto Antes', key: 'fotoAntes', width: 15 },
    { header: 'Foto Después', key: 'fotoDespues', width: 15 },
    { header: 'Coordenadas GPS', key: 'coords', width: 22 }
  ];

  ALL_REGISTROS.forEach(r => {
    const d = new Date(r.fechaCreacion);
    const folio = formatearFolio(r.id, r.fechaCreacion);
    const fReg = `${d.toLocaleDateString('es-MX')} ${d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}`;
    
    const dIni = r.fechaEnProceso ? new Date(r.fechaEnProceso) : null;
    const fIni = dIni ? `${dIni.toLocaleDateString('es-MX')} ${dIni.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}` : 'N/A';
    
    const dFin = r.fechaAplicado ? new Date(r.fechaAplicado) : null;
    const fFin = dFin ? `${dFin.toLocaleDateString('es-MX')} ${dFin.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}` : 'N/A';

    const coords = (r.lat && r.lng) ? `${r.lat}, ${r.lng}` : 'Sin GPS';

    worksheet.addRow({
      folio: folio,
      fechaReg: fReg,
      fechaIni: fIni,
      fechaFin: fFin,
      nombre: r.nombre || 'Sin nombre',
      colonia: r.colonia || '',
      direccion: r.direccion || '',
      referencia: r.referencia || '',
      categoria: r.tipo || '',
      prioridad: (r.prioridad || 'media').toUpperCase(),
      descripcion: r.descripcion || '',
      estado: (r.estado || 'pendiente').toUpperCase(),
      fotoAntes: r.foto ? 'Disponible' : 'Sin foto',
      fotoDespues: r.fotoDespues ? 'Disponible' : 'Sin foto',
      coords: coords
    });
  });

  const borderStyle = {
    top: { style: 'thin', color: { argb: 'FF808080' } },
    left: { style: 'thin', color: { argb: 'FF808080' } },
    bottom: { style: 'thin', color: { argb: 'FF808080' } },
    right: { style: 'thin', color: { argb: 'FF808080' } }
  };

  const headerRow = worksheet.getRow(1);
  headerRow.font = { name: 'Calibri', size: 11, bold: true };
  headerRow.alignment = { vertical: 'middle', horizontal: 'center' };
  headerRow.eachCell(cell => {
    cell.border = {
      top: { style: 'medium', color: { argb: 'FF000000' } },
      left: { style: 'thin', color: { argb: 'FF000000' } },
      bottom: { style: 'medium', color: { argb: 'FF000000' } },
      right: { style: 'thin', color: { argb: 'FF000000' } }
    };
  });

  worksheet.eachRow((row, rowNumber) => {
    if (rowNumber > 1) {
      row.font = { name: 'Calibri', size: 11 };
      row.alignment = { vertical: 'middle', horizontal: 'left' };
      row.eachCell(cell => {
        cell.border = borderStyle;
      });
    }
  });

  const buffer = await workbook.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `reporte_global_admin_pan_${new Date().toISOString().slice(0,10)}.xlsx`;
  a.click();
});
</script>
</body>
</html>
